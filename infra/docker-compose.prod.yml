# Production overlay for a solo clinic deployment.
# Usage:
#   cp .env.production.example .env
#   # edit secrets, domain, and TLS cert paths
#   docker compose -f infra/docker-compose.prod.yml up --build -d
#
# First-time TLS (Let's Encrypt example):
#   mkdir -p infra/certs infra/certbot/www
#   # obtain certs into infra/certs/fullchain.pem and infra/certs/privkey.pem
#   # then start the stack

name: clinicsys-prod

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  celery:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--loglevel=info"]
    restart: unless-stopped

  web:
    build:
      context: ../web
    environment:
      API_PROXY_TARGET: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  postgres_data:
